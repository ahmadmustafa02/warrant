# pnpm 10+ requires explicit approval for dependency build scripts.
# Only the packages that genuinely need native builds are enabled.
allowBuilds:
  '@prisma/engines': true # Prisma query/migration engines — required.
  prisma: true # Prisma CLI postinstall — required.
  esbuild: true # Used by Vitest and tsx.
  unrs-resolver: true # Native module resolver used by ESLint.
  msgpackr-extract: false # Optional serialization accelerator; not needed.
  sharp: false # Image optimization is handled by the deploy platform.
  workerd: false # Not used; we do not target the workers runtime.
